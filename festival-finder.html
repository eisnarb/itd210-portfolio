<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival Finder - A Beginner's Guide to EDM</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      padding-top: var(--navHeight);
    }

    /*Set grid for the page*/
    main {
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      grid-template-areas: 
      "intro intro intro"
      "filter header empty"
      "filter search empty"
      "pages pages pages"
    }

    #intro {
      grid-area: intro;
      text-align: center;
    }

    .filter-sidebar {
      grid-area: filter;
    }

    .search-container {
      grid-area: search;
      background-color: var(--iron);
      height: 70vh;
      overflow: scroll;
      scrollbar-gutter: stable;
      text-align: center;
    }

    /*Searchbar styles*/
    input {
      width: 40vw;
      min-width: 200px;
      height: 30px;
      margin-right: 5px;
      margin-bottom: 5px;
      border: 1px #2ab7ca solid;
      border-radius: 5px;
      background-color: #44454573;
      font-size: 18px;
      color: var(--smoke);
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 0 2px #2ab7ca;
    }

    #searchEvent {
      border: 1px #2ab7ca groove;
      border-radius: 20px;
      background-color: #6987c94d;
      color: #2ab7ca;
      width: 100px;
      height: 40px;
      font-size: 20px;
      text-transform: uppercase;
    }

    #searchEvent:hover {
      cursor: pointer;
      transform: scale(1.03);
      transition: all 0.2s;
    }

    /*Results Styles*/
    #resultsHeader {
      grid-area: header;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      align-items: center;
      top: var(--navHeight);
      padding-right: 22px;
      position: sticky;
      background-color: var(--glaucous);
      color: var(--smoke);
      border-bottom: 2px #2ab7ca solid;
    }

    .name {
      text-align: center;
    }

    .location {
      text-align: center;
    }

    .date {
      text-align: right;
    }

    #searchPages {
      grid-area: pages;
      justify-self: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .event-card {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-areas: "name location date"; 
      align-items: center;
      gap: 10px;
      padding: 5px;
    }

    .event-card:hover {
      background-color: var(--glaucous);
    }

    .event-name{
      grid-area: name;
      text-align: center;
    }

    .event-location {
      grid-area: location;
      text-align: center;
    }

    .event-date {
      grid-area: date;
      text-align: right;
    }

    footer {
      bottom: 0;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="mobileNav">
        <span></span><span></span><span></span>
      </div>
      <div class="navLinks">
        <a href="index.html">Home</a>
        <a href="about-edm.html">What is EDM?</a>
        <a href="edm-culture.html">EDM Culture</a>
        <a href="concert-guide.html">Concert Guide</a>
        <a href="about.html">About</a>
      </div>
    </nav>
  </header>
  <main>
    <div id="intro">
      <h1>Festival Finder</h1>
      <p>Now that you've learned the ropes it's time to go a show!</p>
      <hr>
      <input type="text" placeholder="Name of Event/Artist/Location" id="eventInput"><button id="searchEvent">search</button>
    </div>
    <div class="filter-sidebar">
      <p>Search filter content goes here</p>
    </div>
    <div id="resultsHeader">
        <p class="name">Event Name</p>
        <p class="location">Location</p>
        <p class="date">Date</p>
      </div>
    <div class="search-container" id="searchResults">
      You haven't searched for anything yet!
    </div>
    <div id="searchPages">
      <button id="prev" disabled><img src="images/previous.svg" width="25px"></button>
      <span id="pageNumber"></span>
      <button id="next"><img src="images/next.svg" width="25px"></button>
    </div>
  </main>
  <footer><p>&copy; 2026</p> <p>Josh Bransford</p> <p>NVCC ITD-210</p></footer>
  <script src="js/script.js" defer></script>
  <script>
    const container = document.getElementById("searchResults");

    const inputBtn = document.getElementById("eventInput");

    const searchBtn = document.getElementById("searchEvent");

    const prevBtn = document.getElementById("prev");

    const nextBtn = document.getElementById("next");

    const pageSize = 25;

    let currentPage = 0;

    //Hide page controls on page load
    document.getElementById("searchPages").style.display = "none";

    //New search function
    function getEvent() {
      //reset page to the first
      currentPage = 0;
      fetchEvents(currentPage);
    }

    //API Fetch request function
    function fetchEvents(page) {
      //get search term
      const keyword = document.querySelector("input").value;
      container.textContent = "Loading search..."

      fetch("https://app.ticketmaster.com/discovery/v2/events.json?countryCode=US&segmentName=Music&genreId=KnvZfZ7vAvF&keyword=" + keyword + "&size=" + pageSize + "&page=" + page + "&apikey=HN4bQHwCtNITu9RVhzQ5qmlAXd9YGez4")

      .then(function(response) {
        return response.json();
      })

      .then(function(data) {
        //Clear data in container
        container.innerHTML = "";
        //Show page controls on search
        document.getElementById("searchPages").style.display = "flex";

        //Guard in case there are no results in the API fetch
        if (!data._embedded || !data._embedded.events) {
          container.innerHTML = "<p>No events found.</p>";
          return;
        }

        //Page number info
        const totalPages = data.page.totalPages;
        document.getElementById("prev").disabled = page === 0; //Back button disabled if first page
        document.getElementById("next").disabled = page >= totalPages - 1; //Next button disabled if last page
        document.getElementById("pageNumber").textContent = "Page " + (page + 1) + " of " + totalPages; //Display page number out of total pages

        //Results display
        data._embedded.events.forEach(function(item) {
          //Date formatting
          const rawDate = item.dates.start.localDate
          const userDate = new Date(rawDate + "T00:00:00").toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric"
          });

          //Find and package location info
          const venue = item._embedded && item._embedded.venues && item._embedded.venues[0];
          const location = venue ? venue.city.name + ', ' + venue.state.stateCode : 'Location TBA';

          //Create card and add class for styling
          var card = document.createElement("div");
          card.classList.add("event-card");
          //Add event info to the card
          card.innerHTML =
          '<p class="event-name">' + item.name + '</p>' + '<p class="event-location">' + location + '</p>' + '<p class="event-date">' + userDate + '</p>';
          container.appendChild(card);
        });
      })

      //Catch any other errors
      .catch(function(error) {
        container.innerHTML = 
        "<p>Sorry, data could not be loaded. Please try again later.</p>";
        console.error("Fetch error:", error);
      })
    }

    //Event listeners
    prevBtn.addEventListener("click", function() {
      currentPage--;
      fetchEvents(currentPage);
    })

    nextBtn.addEventListener("click", function() {
      currentPage++;
      fetchEvents(currentPage);
    })

    searchBtn.addEventListener("click", getEvent);

    inputBtn.addEventListener("keydown", function(event) {
      if(event.key === "Enter") {
        getEvent();
      }
    });
  </script>
</body>
</html>
